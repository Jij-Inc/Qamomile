# Every third-party action below is pinned to a full commit SHA instead of a
# mutable tag such as v4. A tag can be repointed at malicious code if the
# action repository is compromised: in March 2025 the tj-actions/changed-files
# incident retagged existing releases and exfiltrated CI secrets from the
# repositories that consumed them. A commit SHA is content-addressed and
# cannot be repointed. The comment on each `uses:` line records the release
# the SHA was resolved from, with a link for verifying the correspondence.

name: Python Test

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.11"

jobs:
  # CI runs the Qamomile core suite in the base environment and each optional
  # backend suite in its matching dependency job.
  base-test:
    name: Qamomile and Qiskit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install base dependencies
        # Unmarked cross-engine tests also exercise Cirq in the base suite.
        run: >-
          uv sync --frozen --no-default-groups --group test-core
          --extra qiskit --extra cirq

      - name: Verify Qiskit dependencies
        run: uv run --no-sync python -c "import qiskit"

      - name: Run Qamomile conformance tests
        # Keep the Const-slice and Param-cast regression matrix local.
        run: >-
          uv run --no-sync pytest tests/qamomile
          --ignore=tests/qamomile/test_const_slice_iteration_regressions.py
          --ignore=tests/qamomile/test_const_slice_iteration_backends.py
          --ignore=tests/qamomile/test_param_real_cast.py
          --deselect="tests/qamomile/test_skill_cli.py::test_skill_examples_execute_from_packaged_sources[integer-rotation-offset-0]"
          --deselect="tests/qamomile/test_skill_cli.py::test_skill_examples_execute_from_packaged_sources[integer-rotation-offset-1]"
          -v

  quri-parts-test:
    name: QURI Parts smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with quri-parts
        run: uv sync --frozen --no-default-groups --group test --extra quri_parts

      - name: Verify QURI Parts dependencies
        run: uv run --no-sync python -c "import quri_parts, quri_parts.qulacs"

      - name: Run Qamomile QURI Parts tests
        run: >-
          uv run --no-sync pytest
          -m "quri_parts and not backend_slow"
          tests/qamomile/test_quri_parts_backend.py
          -v

  qir-test:
    name: QIR export and execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install QIR generator and local consumer
        # Qiskit supplies reference operators for the QIR equivalence tests.
        run: >-
          uv sync --frozen --no-default-groups --group test --group qir-test
          --extra qir --extra qiskit

      - name: Verify QIR dependencies
        run: uv run --no-sync python -c "import pyqir, qirrunner"

      - name: Verify and execute exported QIR
        run: >-
          uv run --no-sync pytest -m qir
          tests/qamomile/test_qir_backend.py
          tests/qamomile/test_skill_cli.py
          -v

  quration-test:
    name: Quration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with quration
        # Qiskit supplies reference states for the Quration equivalence tests.
        run: uv sync --frozen --no-default-groups --group test --extra quration --extra qiskit

      - name: Verify Quration dependencies
        run: uv run --no-sync python -c "import pyqret"

      - name: Run Qamomile Quration tests
        run: >-
          uv run --no-sync pytest
          -m "quration"
          tests/qamomile/test_quration_backend.py
          -v

  cirq-test:
    name: Cirq and Google QVM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with Cirq
        run: uv sync --frozen --no-default-groups --group test --extra cirq

      - name: Verify Cirq dependencies
        run: uv run --no-sync python -c "import cirq, cirq_google"

      - name: Run Qamomile Cirq tests
        run: >-
          uv run --no-sync pytest
          -m "cirq and not backend_slow"
          tests/qamomile/test_cirq_backend.py
          -v

  braket-test:
    name: Amazon Braket smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with Amazon Braket
        run: uv sync --frozen --no-default-groups --group test --extra braket

      - name: Verify Amazon Braket dependencies
        run: uv run --no-sync python -c "import braket.circuits, braket.devices"

      - name: Run Qamomile Amazon Braket tests
        run: >-
          uv run --no-sync pytest
          -m "braket and not backend_slow"
          tests/qamomile/test_braket_backend.py
          -v

  hugr-test:
    name: HUGR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with HUGR
        run: uv sync --frozen --no-default-groups --group test --extra hugr

      - name: Verify HUGR dependencies
        run: uv run --no-sync python -c "import hugr, selene_sim"

      - name: Run Qamomile HUGR tests
        run: >-
          uv run --no-sync pytest
          -m "hugr and not hugr_slow and not guppy"
          tests/qamomile/test_hugr_backend.py
          -v

      - name: Install Guppy-compatible HUGR dependencies
        run: uv sync --frozen --no-default-groups --group test --extra guppy

      - name: Verify Guppy dependencies
        run: uv run --no-sync python -c "import guppylang, hugr, tket_exts"

      - name: Link Qamomile libraries from Guppy
        run: >-
          uv run --no-sync pytest
          -m "hugr and guppy"
          tests/qamomile/test_hugr_backend.py
          -v

  cudaq-test-ubuntu:
    name: CUDA-Q smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the repository
        # v4.4.0 = https://github.com/actions/checkout/releases/tag/v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0 = https://github.com/actions/setup-python/releases/tag/v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # v5.4.2 = https://github.com/astral-sh/setup-uv/releases/tag/v5.4.2
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Install dependencies with CUDA-Q
        run: uv sync --frozen --no-default-groups --group test --extra cudaq-cu12

      - name: Verify CUDA-Q dependencies
        run: uv run --no-sync python -c "import cudaq"

      - name: Run Qamomile CUDA-Q tests
        run: >-
          uv run --no-sync pytest
          -m "cudaq and not backend_slow"
          tests/qamomile/test_cudaq_backend.py
          -v
