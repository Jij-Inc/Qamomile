# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: qamomile-docs-en
  title: Qamomile Documentation
  description: A source-compiled, type-safe functional quantum programming language
  keywords:
    - quantum computing
    - optimization
    - resource estimation
  authors:
    - name: JIJ Inc.
  github: https://github.com/Jij-Inc/Qamomile
  jupyter: true
  execute:
    enabled: false
    cache: true
  toc:
    - file: index.md
