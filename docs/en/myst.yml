      file: tutorial/index.md
      children:
        - pattern: tutorial/*.ipynb
    - title: Algorithms
      file: algorithm/index.md
      children:
        - pattern: algorithm/*.ipynb
    - pattern: "tags/*.md"
      hidden: true
    - title: Usage
      file: usage/index.md
      children:
        - pattern: usage/*.ipynb
    - title: Integration
      file: integration/index.md
      children:
        - pattern: integration/*.ipynb
    - title: Release Notes
      file: release_notes/index.md
      children:
        - file: release_notes/v0_16_0_rc1.md
