[workspace]
resolver = "2"
members = [
    "rust/qamomile-compiler",
    "rust/qamomile-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
num-bigint = "0.5.1"
num-complex = "0.4.6"
num-rational = { version = "0.4.2", default-features = false, features = ["std"] }
num-traits = "0.2.19"
prost = "0.14.3"
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"
pyo3 = { version = "0.29.1", features = ["abi3-py311"] }
qamomile-compiler = { path = "rust/qamomile-compiler" }
sha2 = "0.10.9"
thiserror = "2.0.17"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
